[project]
name = "condor-telegram-trader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.13,<4", "pydantic>=2.12,<3", "telethon==1.45.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
